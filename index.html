
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Centered Image</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1e1e2f, #0a0a12);
      }

      img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <img src="b1barrier.png" alt="Image">
  </body>
</html>
